<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Prueba de interacción</title>
<style>body { font: 14px monospace; } iframe { border: 1px solid #888; }</style>
</head>
<body>
<pre id="out">corriendo…</pre>
<iframe id="app" src="../index.html" width="420" height="620"></iframe>
<script>
/*
 * Drives the real page in a real browser, through a same-origin iframe, and
 * prints what the app did. `--dump-dom` alone cannot type, and the manual rate
 * field is exactly where the thousand-fold misreading used to happen.
 */
const out = document.getElementById('out');
const lines = [];

function say(name, actual) {
  lines.push(`${name}: ${JSON.stringify(actual)}`);
}

function type(win, element, text) {
  element.value = text;
  element.dispatchEvent(new win.Event('input', { bubbles: true }));
}

function done() {
  out.textContent = lines.join('\n');
}

/* The result blocks are read by the currency they lead to, so adding the euro
   cannot silently change what an earlier assertion was looking at. */
function blockFor(doc, label) {
  return [...doc.querySelectorAll('.result')]
    .find((block) => block.querySelector('.result-target').textContent.includes(label));
}

function linesFor(doc, label) {
  return [...blockFor(doc, label).querySelectorAll('.line-value')].map((n) => n.textContent);
}

function labelsFor(doc, label) {
  return [...blockFor(doc, label).querySelectorAll('.line-source')]
    .map((n) => n.firstChild.nodeValue);
}

window.addEventListener('load', () => {
  setTimeout(() => {
    try {
      const frame = document.getElementById('app');
      const doc = frame.contentDocument;
      const win = frame.contentWindow;

      // 1. Paste the Binance price, exactly as Binance shows it.
      const binance = doc.querySelector('[data-key="binance"]');
      type(win, binance, '1011.500');
      say('nota de la tasa', doc.querySelector('[data-read-as="binance"]').textContent.trim());
      say('quedo marcada como tu valor', binance.classList.contains('is-manual'));
      say('aparece el boton de volver', !doc.getElementById('reset-rates').hidden);

      // 2. The result must be built on 1011.5, not on 1011500 and not on the
      //    fetched rate. Only 1011.5 produces 317.907,81 here.
      say('resultado en Bs', linesFor(doc, 'Bs'));

      // 3. An amount that could be read two ways must say which one was used.
      type(win, doc.getElementById('amount'), '1000.500');
      say('nota del monto', doc.getElementById('amount-note').textContent.trim());

      // 4. Clearing the field must drop the override instead of using zero.
      type(win, binance, '');
      say('el boton de volver se esconde', doc.getElementById('reset-rates').hidden);
      say('vuelve la tasa automatica', linesFor(doc, 'Bs'));

      // 5. The euro: a fourth currency, five rates, and one line per coherent
      //    pair. With 10 EUR on screen the two Bs lines are the two euro
      //    readings of the live file, and COP crosses each of them with its own
      //    dollar, never with the other market's.
      type(win, doc.getElementById('amount'), '10');
      doc.querySelector('#currency button[data-currency="EUR"]').click();
      say('pestanas de moneda',
        [...doc.querySelectorAll('#currency button')].map((b) => b.dataset.currency));
      say('claves de las cinco tasas',
        [...doc.querySelectorAll('.rate-input')].map((n) => n.dataset.key));
      say('destinos desde EUR',
        [...doc.querySelectorAll('.result-target')].map((n) => n.textContent));
      say('etiquetas en Bs', labelsFor(doc, 'Bs'));
      say('etiquetas en COP', labelsFor(doc, 'COP'));
      say('10 EUR a Bs', linesFor(doc, 'Bs'));
      say('10 EUR a COP', linesFor(doc, 'COP'));

      // 6. A euro typed by hand must win like the dollar ones, and it must move
      //    only its own line: the official pair cannot follow the street euro.
      const usdOficial = () => linesFor(doc, 'USD')[0];
      const euroParalelo = doc.querySelector('[data-key="eur_paralelo"]');
      say('EUR a USD oficial antes', usdOficial());
      type(win, euroParalelo, '2000');
      say('EUR a USD oficial despues', usdOficial());
      say('EUR a USD paralelo despues', linesFor(doc, 'USD')[1]);
      say('10 EUR a Bs con el paralelo a mano', linesFor(doc, 'Bs'));
      type(win, euroParalelo, '');

      // 7. The refresh button has to reach the live sources from the browser.
      //    TRM, both DolarApi dollar rates and both euro rates are reachable;
      //    Binance P2P is not, which is why the button asks DolarApi for both
      //    Venezuelan dollar rates.
      say('existe el boton de actualizar', Boolean(doc.getElementById('refresh')));
      doc.getElementById('refresh').click();

      let tries = 0;
      const poll = () => {
        const status = doc.getElementById('refresh-status').textContent.trim();
        if (status && !status.startsWith('Consultando')) {
          say('estado del boton', status);
          say('marca de actualizacion', doc.getElementById('updated').textContent.trim());
          say('fuente de cada tasa', [...doc.querySelectorAll('.rate-meta')].map((n) => n.textContent.trim()));
          done();
          return;
        }
        if (++tries > 80) { say('estado del boton', 'SIN RESPUESTA tras 20s'); done(); return; }
        setTimeout(poll, 250);
      };
      setTimeout(poll, 500);
    } catch (error) {
      out.textContent = `ERROR: ${error.message}\n${lines.join('\n')}`;
    }
  }, 2500);
});
</script>
</body>
</html>
